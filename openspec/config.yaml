schema: spec-driven

context: |
  Лікар Поруч is a Ukrainian-first private medical center website, not a directory, marketplace, or aggregator.
  The site is an Astro static build deployed privately at https://sur.kyiv.ua/likar-poruch/ and served from /home/sgdt1a/.local/share/likar-poruch-site. GitHub is the source of record, not the production host.
  Ukrainian is the only interface language and indexed route set. Retired Russian routes are intentionally absent and must not be restored without an explicit policy change.
  Appointment requests validate in the browser and are saved only as a local draft; the site does not send the request. Users must call the clinic to pass on the request, and the site must not claim that a request is a confirmed appointment.
  Never send names, phone numbers, symptoms, diagnoses, or other patient data to PostHog or any analytics provider.
  Routine content is edited through Pages CMS using .pages.yml and JSON files under src/data/.
  Emergency information must direct users to 103 or 112 and must not imply that planned care replaces emergency help.
  Use Conventional Commits. A worktree-only or staged change is never complete. Commit and push the task branch, integrate into main, push main, then deploy the exact clean origin/main commit with npm run deploy:sur and verify the live SUR URL. Before deployment, run npm run check, npm test, npm run qa:browser, npm audit --omit=dev, and git diff --check.

rules:
  proposal:
    - State patient-data and privacy implications explicitly.
    - State what is out of scope and identify any external credentials or services required.
  specs:
    - Include Ukrainian-only language, route, and metadata acceptance criteria when a user-facing route or metadata changes.
    - Include the private SUR /likar-poruch/ base-path and canonical-origin behavior in relevant scenarios.
  design:
    - Prefer simple static architecture and official integrations over adding a backend.
    - Explain any new handling of contact or health information.
  tasks:
    - Include automated verification and a live deployment smoke test.
    - Keep tasks small enough to verify independently.

operations:
  apply:
    guidance:
      - Preserve the private-medical-center positioning and existing visual language.
      - Do not expose credentials or patient data in source, logs, tests, analytics, or documentation.
  archive:
    guidance:
      - Record final verification evidence and any remaining operational dependency.
