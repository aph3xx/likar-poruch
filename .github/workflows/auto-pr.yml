name: Open task pull request

on:
  push:
    branches:
      - 'task/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open:
    if: github.repository == 'aph3xx/likar-poruch'
    runs-on: ubuntu-latest
    steps:
      - name: Create or reuse the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          title="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n '1p')"
          if [[ -z "$title" || "$title" == Merge\ * ]]; then
            title="chore: integrate ${HEAD_BRANCH}"
          fi

          pr_url="$(gh pr list \
            --repo "$REPOSITORY" \
            --head "$HEAD_BRANCH" \
            --base main \
            --state open \
            --json url,isCrossRepository \
            --jq 'map(select(.isCrossRepository == false)) | .[0].url // empty')"

          if [[ -z "$pr_url" ]]; then
            body_file="$RUNNER_TEMP/auto-pr-body.md"
            cat > "$body_file" <<EOF
          ## Automated task pull request

          This pull request was opened from the Hermes task branch \`$HEAD_BRANCH\`.

          This pull request is intentionally not auto-merged. Integration requires an explicit independent reviewer PASS for this exact commit/tree and a merger card whose parent is that review.

          Automation run: $RUN_URL
          EOF

            pr_url="$(gh pr create \
              --repo "$REPOSITORY" \
              --base main \
              --head "$HEAD_BRANCH" \
              --title "$title" \
              --body-file "$body_file")"
          fi

          printf 'Pull request ready for independent review: %s\n' "$pr_url"
