media:
  input: public/images
  output: /likar-poruch/images
  categories: [image]
  extensions: [jpg, jpeg, png, webp, svg]

content:
  - name: site
    label: Налаштування медичного центру
    type: file
    path: src/data/site.json
    format: json
    fields:
      - { name: name, label: Назва, type: string, required: true }
      - { name: tagline, label: Гасло, type: text, required: true }
      - { name: demoNotice, label: Опис практики, type: text, required: true }
      - { name: address, label: Адреса, type: string, required: true }
      - { name: phone, label: Телефон у міжнародному форматі, type: string, required: true }
      - { name: phoneDisplay, label: Телефон для показу, type: string, required: true }
      - { name: emergencyNotice, label: Екстрене повідомлення, type: text, required: true }
      - { name: medicalDisclaimer, label: Медичне застереження, type: text, required: true }
  - name: articles
    label: Статті
    type: file
    path: src/data/articles.json
    format: json
    list: true
    fields:
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: title, label: Заголовок, type: string, required: true }
      - { name: description, label: SEO опис, type: text, required: true }
      - { name: category, label: Категорія, type: string }
      - { name: published, label: Опубліковано, type: date, required: true }
      - { name: updated, label: Оновлено, type: date, required: true }
      - { name: readingTime, label: Час читання, type: string }
      - { name: author, label: Автор, type: string }
      - { name: reviewer, label: Медична перевірка, type: string }
      - { name: intro, label: Вступ, type: text }
      - name: sections
        label: Розділи
        type: object
        list: true
        fields:
          - { name: heading, label: Підзаголовок, type: string }
          - { name: text, label: Текст, type: text }
